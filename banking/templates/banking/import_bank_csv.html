<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Import Bank CSV</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
    
    <style>
      select,
      input[type="file"] {
        display: block;
        width: 100%;
      }
 
    .page-container {
      max-width: 800px;
      margin: 0 auto;
    }
  </style>
</head>

<body class="bg-light">

<div class="page-container py-4 px-3">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h1 class="mb-1">Import Bank CSV</h1>
      <div class="text-muted">Upload a TD bank transaction export</div>
    </div>

    <a href="{% url 'banking:dashboard' %}" class="btn btn-outline-secondary">
      Dashboard
    </a>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-body">

      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="mb-3">
          {{ form.account_name.label_tag }}
          {{ form.account_name }}
        </div>

        <div class="mb-3">
          {{ form.csv_file.label_tag }}
          {{ form.csv_file }}
        </div>

        <button type="submit" class="btn btn-primary">
          Import CSV
        </button>
      </form>
    </div>
  </div>

</div>

</body>
</html>
