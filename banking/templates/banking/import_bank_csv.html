<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Import Bank CSV</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
    
<style>

.page-container {
    max-width: 760px;
    margin: 0 auto;
}

.upload-card {
    border-radius: 1rem;
}

select,
input[type="file"] {
    display: block;
    width: 100%;
    border: 1px solid #ced4da;
    background-color: #fff;
}

select {
    padding: 0.55rem 0.75rem;
    border-radius: 0.5rem;
}

input[type="file"] {
    padding: 0.5rem;
    border-radius: 0.5rem;
    font-size: 0.95rem;
}

select:focus,
input[type="file"]:focus {
    border-color: #86b7fe;
    outline: 0;
    box-shadow: 0 0 0 0.25rem rgba(13,110,253,.25);
}

input[type="file"]:hover {
    border-color: #86b7fe;
}

input[type="file"]::file-selector-button {
    border: 1px solid #6c757d;

    border-radius: 0.5rem;
    padding: 0.35rem;
    margin-left: 0.25rem;
    margin-right: 1rem;
    margin-top: 0.25rem;
    margin-bottom: 0.25rem;

    background: white;

    color: #6c757d;

    cursor: pointer;

    transition: all 0.2s ease;
}

input[type="file"]::file-selector-button:hover {
    background: #6c757d;
    color: white;
}

</style>

</head>

<body class="bg-light">

<div class="page-container py-4 px-3">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <legend class="mb-1">Import Bank CSV</legend>
     
    </div>

    <a href="{% url 'banking:dashboard' %}" class="btn btn-outline-secondary">
      Dashboard
    </a>
  </div>

  <div class="card shadow-sm border-0 upload-card">
  <div class="card-body p-4">

    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}

      <div class="mb-4">
        <label class="form-label fw-semibold" for="{{ form.account_name.id_for_label }}">
          Account
        </label>
        {{ form.account_name }}
        <div class="form-text">
          Choose the account this file belongs to.
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold" for="{{ form.csv_file.id_for_label }}">
          CSV File
        </label>
        {{ form.csv_file }}
        <div class="form-text">
          Upload a bank or credit card export file.
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center">
        <a href="{% url 'banking:dashboard' %}" class="btn btn-outline-secondary ">
          Cancel
        </a>

        <button type="submit" class="btn btn-outline-secondary px-4">
          Preview Import
        </button>
      </div>
    </form>

  </div>
</div>

</div>

</body>
</html>
