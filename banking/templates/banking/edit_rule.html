<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Edit Rule</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    .page-container {
      max-width: 800px;
      margin: 0 auto;
    }
  </style>
</head>

<body class="bg-light">

<div class="page-container py-4 px-3">

  <div class="mb-4">
    <h1 class="mb-1">Edit Rule</h1>
    <div class="text-muted">{{ rule.keyword }} → {{ rule.category }}</div>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-body">

      <form method="post">
        {% csrf_token %}

        <div class="mb-3">
          <label class="form-label">Keyword</label>
          <input
            type="text"
            name="keyword"
            class="form-control"
            value="{{ rule.keyword }}"
            required
          >
        </div>

        <div class="mb-3">
          <label class="form-label">Category</label>
          <select name="category" class="form-select" required>
            {% for category in categories %}
              <option value="{{ category }}" {% if rule.category == category %}selected{% endif %}>
                {{ category }}
              </option>
            {% endfor %}
          </select>
        </div>

        <div class="form-check mb-4">
          <input
            class="form-check-input"
            type="checkbox"
            name="apply_to_existing"
            id="apply_to_existing"
            checked
          >
          <label class="form-check-label" for="apply_to_existing">
            Apply this rule to existing matching transactions
          </label>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">
            Save Rule
          </button>

          <a href="{% url 'banking:rules_management' %}" class="btn btn-outline-secondary">
            Cancel
          </a>
        </div>

      </form>

    </div>
  </div>

</div>

</body>
</html>
