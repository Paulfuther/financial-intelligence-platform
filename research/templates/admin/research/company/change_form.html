{% extends "admin/change_form.html" %}

{% block object-tools-items %}

    {% if original and original.pk %}
        <li>
            <form
                method="post"
                action="{% url 'admin:research_company_refresh' original.pk %}"
                style="display: inline;"
            >
                {% csrf_token %}

                <button
                    type="submit"
                    class="button"
                    style="
                        background: #417690;
                        color: white;
                        border: 0;
                        padding: 10px 15px;
                        border-radius: 4px;
                        cursor: pointer;
                    "
                >
                    Refresh from SEC
                </button>
            </form>
        </li>
    {% endif %}

    {{ block.super }}

{% endblock %}
